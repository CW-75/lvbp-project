name: Full CI Pipeline

on:
  push:
    branches: ["master", "develop", "feature/*"]
  pull_request:
    branches: ["master", "develop"]

env:
  # Configure testcontainers for CI
  TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
  TESTCONTAINERS_RYUK_DISABLED: "true"
  TESTCONTAINERS_REUSE_ENABLE: "true"

jobs:
  # Job 1: Verify Docker Compose builds and starts correctly
  docker-compose-verify:
    name: Docker Compose Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for testing
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "DB_HOST=localhost" > .env
            echo "DB_PORT=5432" >> .env
            echo "DB_USER=postgres" >> .env
            echo "DB_PASSWORD=postgres" >> .env
            echo "DB_NAME=lvbp" >> .env
            echo "REDIS_HOST=localhost" >> .env
            echo "REDIS_PORT=6379" >> .env
            echo "REDIS_PASSWORD=" >> .env
            echo "JWT_SECRET=test-secret" >> .env
            echo "PORT=8080" >> .env
          fi

      - name: Build and Test Docker Compose
        run: |
          docker compose up -d --build
          sleep 15
          if docker compose ps | grep -q "Exit"; then
            echo "One or more containers failed to start:"
            docker compose logs
            exit 1
          fi
          docker compose down

  # Job 2: Backend tests (unit + integration with testcontainers)
  # Runs AFTER docker-compose-verify passes
  backend-tests:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    needs: docker-compose-verify
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lvbp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Download dependencies
        run: go mod download

      - name: Generate sqlc code
        run: sqlc generate

      - name: Run Backend Unit Tests
        run: go test -v ./... -short

      - name: Run Backend Integration Tests (with testcontainers)
        run: go test -v ./internal/... -count=1

  # Job 3: Optional - Run tests against the actual Docker Compose stack
  # This verifies the app works with the real containers, not just testcontainers
  docker-integration-test:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    needs: docker-compose-verify
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for testing
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "DB_HOST=localhost" > .env
            echo "DB_PORT=5432" >> .env
            echo "DB_USER=postgres" >> .env
            echo "DB_PASSWORD=postgres" >> .env
            echo "DB_NAME=lvbp" >> .env
            echo "REDIS_HOST=localhost" >> .env
            echo "REDIS_PORT=6379" >> .env
            echo "REDIS_PASSWORD=" >> .env
            echo "JWT_SECRET=test-secret" >> .env
            echo "PORT=8080" >> .env
          fi

      - name: Start Docker Compose Stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          sleep 20
          docker compose ps

      - name: Run Backend Tests against Live Stack
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: lvbp
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_SECRET: test-secret
        run: |
          go test -v ./... -count=1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down