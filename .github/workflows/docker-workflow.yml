name: Docker Workflow CI

on:
  push:
    branches: ["master", "feature/*", "develop"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23" # Ajusta esto a tu versión de Go si es distinta
          cache: true

      - name: Run Backend Tests
        working-directory: ./backend
        run: go test -v ./...

