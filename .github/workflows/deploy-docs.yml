name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'backend/**/*.go'
      - 'web/src/**/*.ts'
      - 'web/src/**/*.tsx'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Install swag (Go OpenAPI generator)
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate OpenAPI Spec
        working-directory: ./backend
        run: |
          swag init -g cmd/api/main.go -o ../docs-site/public/api --parseDependency --parseInternal

      - name: Install typedoc
        run: pnpm add -g typedoc typedoc-plugin-markdown

      - name: Generate TypeScript Docs
        working-directory: ./web
        run: |
          pnpm install --frozen-lockfile
          npx typedoc --out ../docs-site/public/typedoc --entryPoints src/lib --plugin typedoc-plugin-markdown --readme none || true

      - name: Install docs dependencies
        working-directory: ./docs-site
        run: pnpm install --frozen-lockfile

      - name: Build VitePress site
        working-directory: ./docs-site
        run: pnpm run build
        env:
          BASE_URL: /lvbp-project/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4