version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: lvbp-backend
    ports:
      - "8081:8080"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/lvbp_db
    depends_on:
      - redis
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: lvbp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lvbp_db
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    restart: always

  redis:
    image: redis:7-alpine
    container_name: lvbp-redis
    ports:
      - "6379:6379"
    restart: always
