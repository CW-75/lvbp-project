# Testcontainers configuration for Windows with Docker Desktop (WSL2 backend)
# Disables rootless mode (not supported on Windows) and uses Docker Desktop instead

# Use Docker Desktop on Windows - testcontainers will auto-detect the npipe socket
# On Linux/macOS/CI, it will use the default unix socket

# Disable rootless mode (not supported on Windows)
testcontainers.rootless.enabled=false

# Reuse containers for faster test execution
testcontainers.reuse.enable=true

# Disable Ryuk (testcontainers reaper) to avoid issues in CI environments
testcontainers.ryuk.disabled=true